<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600, initial-scale=1" />
    <title>Document Automation Workspace Workflow Builder</title>
    <link rel="stylesheet" href="./readme-artboards.css" />
  </head>
  <body>
    <main class="artboard">
      <header style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <p class="eyebrow">Workflow Builder</p>
          <h1 style="font-size: 56px;">실제 워크플로우 빌더 화면</h1>
        </div>
        <div style="display: flex; gap: 10px;">
          <span class="pill">실제 캡처</span>
          <span class="pill muted-pill">노드 연결</span>
          <span class="pill muted-pill">실행 제어</span>
        </div>
      </header>

      <section class="surface" style="height: 760px; margin-top: 32px; overflow: hidden; padding: 14px;">
        <div style="border: 1px solid var(--gray-200); border-radius: 18px; height: 730px; overflow: hidden; width: 100%;">
          <img
            alt="Workflow Builder actual screen"
            src="./workflow-builder-capture.png"
            style="display: block; transform: translateY(-84px); width: 100%;"
          />
        </div>
      </section>
    </main>
  </body>
</html>
