<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600, initial-scale=1" />
    <title>Document Automation Workspace Workflow Builder</title>
    <link rel="stylesheet" href="./readme-artboards.css" />
  </head>
  <body>
    <main class="artboard">
      <header style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <p class="eyebrow">Workflow Builder</p>
          <h1 style="font-size: 56px;">워크플로우 빌더</h1>
        </div>
        <div style="display: flex; gap: 10px;">
          <span class="pill">진행률 표시</span>
          <span class="pill muted-pill">결과 상세 보기</span>
        </div>
      </header>

      <section class="surface" style="height: 760px; margin-top: 32px; overflow: hidden; padding: 14px;">
        <img
          alt="Workflow Builder actual screen"
          src="./workflow-builder-capture.png"
          style="border: 1px solid var(--gray-200); border-radius: 18px; display: block; height: 730px; object-fit: cover; object-position: top center; width: 100%;"
        />
      </section>
    </main>
  </body>
</html>
